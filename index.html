<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<title>Idiomas · Mi tutor</title>
<style>
  :root { --bg:#0b1220; --panel:#151d2e; --line:#26324a; --txt:#e8edf7; --sub:#93a0b8; --acc:#4ade80; --warn:#fb923c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; }
  header { padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  header h1 { font-size:20px; margin:0; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:8px 0; }
  nav button { background:none; border:0; color:var(--sub); font-size:14px; padding:8px; }
  nav button.on { color:var(--acc); font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .btn { background:var(--acc); color:#06210f; border:0; border-radius:10px; padding:12px 18px; font-size:16px; font-weight:600; cursor:pointer; }
  .btn.sec { background:transparent; color:var(--txt); border:1px solid var(--line); }
  .muted { color:var(--sub); font-size:14px; }
  .big { font-size:30px; font-weight:700; }
  .sub { font-size:20px; margin:6px 0 10px; font-weight:600; }
  .letra { font-size:88px; font-weight:800; text-align:center; line-height:1.1; margin:12px 0; }
  .pron { font-size:20px; color:var(--acc); margin:6px 0; }
  .tag { display:inline-block; font-size:12px; padding:3px 9px; border-radius:99px; border:1px solid var(--line); color:var(--sub); margin-right:6px; }
  .tag.dir { color:var(--acc); border-color:var(--acc); }
  .tag.formal { color:#60a5fa; } .tag.informal { color:var(--warn); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .bar { height:8px; background:#0f1626; border-radius:99px; overflow:hidden; margin-top:6px; }
  .bar > div { height:100%; background:var(--acc); transition:width .3s; }
  .opt { display:block; width:100%; text-align:left; margin-top:10px; background:#0f1626; border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px 14px; font-size:16px; cursor:pointer; }
  .opt:disabled { cursor:default; }
  .opt.ok { border-color:var(--acc); color:var(--acc); }
  .opt.mal { border-color:var(--warn); color:var(--warn); }
  .ses { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .ses.bloq { opacity:.45; }
  .idi { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px; font-size:14px; }
  .llam { background:linear-gradient(#2a2f6b, #0b1220); border:1px solid var(--line); border-radius:18px; padding:14px; }
  .avatar { width:200px; display:block; margin:6px auto 0; }
  .habla .boca { animation: boca .22s infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes boca { from { transform: scaleY(.3); } to { transform: scaleY(2); } }
  .subt { background:rgba(15,22,38,.88); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
  .pad { height:80px; }
  .aviso { position:fixed; left:12px; right:12px; bottom:76px; z-index:20; background:#3b2410; border:1px solid var(--warn); color:var(--txt); border-radius:12px; padding:12px; display:flex; gap:10px; align-items:center; justify-content:space-between; font-size:14px; max-width:696px; margin:0 auto; }
  table td { padding:6px 4px; border-bottom:1px solid var(--line); }
  /* Movimiento suave: tarjetas que aparecen y botones que responden al toque */
  @keyframes subir { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .card { animation: subir .4s ease both; }
  .btn, .opt, nav button { transition: transform .15s ease, filter .15s ease; }
  .btn:active, .opt:active { transform: scale(.97); }
  .bar > div { transition: width .6s ease; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  /* Fondo por pantalla: la imagen de cada vista queda detrás, con velo oscuro para leer bien */
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background-size:cover; background-position:center; background-color:var(--bg); }
  body[data-vista="hoy"]::before { background-image: linear-gradient(rgba(11,18,32,.72), rgba(11,18,32,.9)), url("img/fondo-hoy.jpg"); }
  body[data-vista="estudiar"]::before { background-image: linear-gradient(rgba(11,18,32,.72), rgba(11,18,32,.9)), url("img/fondo-repasar.jpg"); }
  body[data-vista="ruta"]::before { background-image: linear-gradient(rgba(11,18,32,.72), rgba(11,18,32,.9)), url("img/cabecera-ruta.jpg"); }
  body[data-vista="mapa"]::before { background-image: linear-gradient(rgba(11,18,32,.72), rgba(11,18,32,.9)), url("img/fondo-mapa.jpg"); }
  body[data-vista="llamada"]::before { background-image: linear-gradient(rgba(11,18,32,.55), rgba(11,18,32,.85)), url("img/fondo-llamada.jpg"); }
  .celebra { display:block; width:100%; max-width:260px; margin:6px auto 4px; border-radius:14px; }
</style>
</head>

  japones: { nombre: "Japonés", lang: "ja-JP",
    guia: [
      "En japonés no hay sílaba fuerte: todas duran lo mismo. Por eso la pronunciación va en minúsculas y separada en sílabas: \"ko-ni-chi-ua\".",

      "\"j\" se dice como la j suave del Caribe (como una h con aire): は = \"ja\".",
      "\"sh\" es como pedir silencio: \"shhh\". \"ch\" es como en \"chino\". \"ts\" es una t y una s pegadas.",
      "\"y\" antes de vocal suena como la \"y\" de \"yo\". \"z\" es una s que zumba, como una abeja.",
      "La u final de \"des\" y \"mas\" casi no se oye: です se dice \"des\", ます se dice \"mas\".",
      "La partícula は se escribe con ha pero se dice \"ua\". La partícula を se dice \"o\"."

// ---------- Estado guardado en el dispositivo (por idioma) ----------
const KEY = "tutor-estado-v2";
let estado = {};
try { estado = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { estado = {}; }
estado.tarjetas ||= {};   // id -> { paso, prox }
estado.sesiones ||= {};   // id de sesión -> true si aprobada
estado.puntajes ||= {};   // id de sesión -> porcentaje
if (!IDIOMAS[estado.idioma]) estado.idioma = "ingles";
function guardar(){ try { localStorage.setItem(KEY, JSON.stringify(estado)); } catch (e) {} }

// ---------- Racha de días ----------
const hoyStr = (d = new Date()) => d.toLocaleDateString("sv-SE");
function registrarDia(){
  estado.dias ||= [];
  const h = hoyStr();
  if (!estado.dias.includes(h)) { estado.dias.push(h); if (estado.dias.length > 400) estado.dias = estado.dias.slice(-400); guardar(); }
}
function rachaDias(){
  const set = new Set(estado.dias || []);
  const d = new Date();
  if (!set.has(hoyStr(d))) d.setDate(d.getDate() - 1); // si hoy aún no estudias, la racha sigue desde ayer
  let n = 0;
  while (set.has(hoyStr(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- Repetición espaciada ----------
// Primera vez: recordar a las pocas horas. Después: 1, 3, 7, 14 y 30 días.
// Acertar avanza un paso; fallar vuelve al inicio.
const H = 3600000, DIA = 24 * H;
const PASOS = [4 * H, DIA, 3 * DIA, 7 * DIA, 14 * DIA, 30 * DIA];
const ahora = () => Date.now();
function primeraVez(id){
  if (!estado.tarjetas[id]) { estado.tarjetas[id] = { paso: 0, prox: ahora() + PASOS[0] }; guardar(); }
}
function programar(id, acierto){
  const t = estado.tarjetas[id] || { paso: 0, prox: 0 };
  t.paso = acierto ? Math.min(t.paso + 1, PASOS.length - 1) : 0;
  t.prox = ahora() + PASOS[t.paso];
  estado.tarjetas[id] = t;
  guardar();
  registrarDia();
}

// ---------- Ayudas de ruta ----------
const esc = t => String(t).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function todasSesiones(k){ return IDIOMAS[k].unidades.flatMap(u => u.sesiones.map(s => ({ ...s, unidad: u.titulo }))); }
function buscarSesion(sid){ return todasSesiones(estado.idioma).find(s => s.id === sid); }
function estaHecha(sid){ return !!estado.sesiones[sid]; }
function desbloqueada(k, i){ const l = todasSesiones(k); return i === 0 || estaHecha(l[i - 1].id); }
function repasosDebidos(k){
  const out = [];
  for (const s of todasSesiones(k)) for (const it of s.items) {
    const t = estado.tarjetas[it.id];
    if (t && t.prox <= ahora()) out.push(it);
  }
  return out;
}
function textoPlazo(t){
  if (!t) return "Sin ver";
  const d = t.prox - ahora();
  if (d <= 0) return "Para repasar";
  return d < DIA ? `Próxima en ${Math.ceil(d / H)} h` : `Próxima en ${Math.ceil(d / DIA)} días`;
}

selIdioma.onchange = () => { estado.idioma = selIdioma.value; guardar(); ir("hoy"); };

let sesionAct = null;

  document.body.dataset.vista = vista;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.view === vista));
  ({ hoy, estudiar, ruta, practicas, llamada, mapa }[vista])();
}
function ir(v){ sesionAct = null; practicaVer = null; vista = v; render(); window.scrollTo(0, 0); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => ir(b.dataset.view));

function hoy(){
  const k = estado.idioma, lista = todasSesiones(k);
  const debidos = repasosDebidos(k).length;
  const hechas = lista.filter(s => estaHecha(s.id)).length;
  const racha = rachaDias();
  const i = lista.findIndex((s, n) => desbloqueada(k, n) && !estaHecha(s.id));
  const sig = i >= 0 ? lista[i] : null;
  app.innerHTML = `
    <div class="card">
      <div class="muted">${IDIOMAS[k].nombre} · tu ruta · 🔥 racha: ${racha} ${racha === 1 ? "día" : "días"}</div>

      <div class="muted">Avance en ${IDIOMAS[k].nombre}</div>
      <div class="bar"><div style="width:${Math.round(hechas / lista.length * 100)}%"></div></div>
      <p class="muted">${hechas} de ${lista.length} sesiones aprobadas (60 % para avanzar).</p>
    </div>
    ${guiaHTML(k)}
    <div class="card">
      <div class="muted">Llevar mi progreso a otro dispositivo</div>
      <p class="muted">Muestra tu código, cópialo y pégalo en el otro teléfono o laptop, en esta misma sección.</p>

// Juegos: 1) ver la palabra y elegir el significado; 2) escuchar y elegir la palabra (desde la 2.ª sesión).
// Dificultad: 2 opciones en las primeras sesiones, 3 después, 4 al final.
function opciones(it, items, n, campo){
  const otros = shuffle(items.filter(x => x.id !== it.id)).slice(0, n - 1).map(x => x[campo]);
  return shuffle([it[campo], ...otros]);
}
// Tipos de pregunta: ver (elige significado), oir (escucha y elige), vf (verdadero o falso),
// escribir (escribe la palabra). Se activan por sesión: las primeras son sencillas, luego se suman más.
function preguntaVF(it, items){
  // Con letras: "M se pronuncia EM" (verdadero o falso sobre la pronunciación, nunca sobre otra palabra).
  const campo = items.every(x => x.pron) ? "pron" : "es";
  const otros = items.filter(x => x.id !== it.id && x[campo] !== it[campo]);
  const verdadero = otros.length === 0 || Math.random() < 0.5;
  const afirm = verdadero ? it[campo] : otros[Math.floor(Math.random() * otros.length)][campo];
  return { modo: "vf", it, campo, afirm, opc: ["Verdadero", "Falso"], correcta: verdadero ? "Verdadero" : "Falso" };
}
function construirJuego(){
  const S = sesionAct, items = S.s.items;
  // La práctica libre usa todos los tipos de pregunta (idx alto).
  const idx = S.s.id === "libre" ? 99 : todasSesiones(estado.idioma).findIndex(x => x.id === S.s.id);
  // Siempre 4 respuestas (o menos si la sesión tiene menos palabras).
  const nOpc = Math.min(4, items.length);
  // Si todas las palabras tienen pronunciación, la pregunta pide la pronunciación (la respuesta no se muestra en el enunciado).
  const campoVer = items.every(x => x.pron) ? "pron" : "es";
  const preg = [];
  for (const it of items) preg.push({ modo: "ver", it, campo: campoVer, opc: opciones(it, items, nOpc, campoVer), correcta: it[campoVer] });
  if (idx >= 1) for (const it of items) preg.push({ modo: "oir", it, opc: opciones(it, items, nOpc, "texto"), correcta: it.texto });
  if (idx >= 1) for (const it of items) preg.push(preguntaVF(it, items));
  if (idx >= 2) for (const it of items) preg.push({ modo: "escribir", it, correcta: it.texto });
  S.preg = shuffle(preg);
  items.forEach(it => primeraVez(it.id));
}
function faseJuego(){
  const S = sesionAct;
  if (!S.preg) construirJuego();
  if (S.n >= S.preg.length) return finalizar();
  const q = S.preg[S.n];
  const L = IDIOMAS[estado.idioma].nombre;
  const dir = { ver: q.campo === "pron" ? `${L} → pronunciación` : `${L} → Español`,
                oir: `Audio → ${L}`, vf: q.campo === "pron" ? `${L} → pronunciación` : `${L} → Español`,
                escribir: `Español → ${L}` }[q.modo];
  let cabeza;
  if (q.modo === "ver") cabeza = q.campo === "pron"
    ? `<div class="muted">¿Cómo se pronuncia?</div><div class="big" style="margin-top:6px">${q.it.texto}</div>`
    : `<div class="muted">¿Qué significa?</div><div class="big" style="margin-top:6px">${q.it.texto}</div>`;
  else if (q.modo === "oir") cabeza = `<div class="muted">Escucha y elige la palabra</div><div class="row"><button class="btn sec" onclick="hablar('${esc(q.it.texto)}')">🔊 Escuchar otra vez</button></div>`;
  else if (q.modo === "vf") cabeza = q.campo === "pron"
    ? `<div class="muted">Verdadero o falso</div><div class="big" style="margin-top:6px;font-size:22px">"${q.it.texto}" se pronuncia "${q.afirm}"</div>`
    : `<div class="muted">Verdadero o falso</div><div class="big" style="margin-top:6px;font-size:22px">"${q.it.texto}" significa "${q.afirm}"</div>`;
  else cabeza = `<div class="muted">Escribe en ${IDIOMAS[estado.idioma].nombre.toLowerCase()} la traducción de esta palabra en español:</div><div class="big" style="margin-top:6px">${q.it.es}</div>`;
  const cuerpo = q.modo === "escribir"
    ? `<input id="resp" class="idi" style="width:100%;font-size:18px;padding:12px;margin-top:12px" autocomplete="off" autocapitalize="none" placeholder="${q.it.romaji ? "En japonés o en letras latinas (ej.: " + q.it.romaji + ")" : "Escríbela aquí"}">
       <div class="row"><button class="btn" onclick="responderEscritura()">Comprobar</button></div>`
    : `<div id="opc">${q.opc.map((o, j) => `<button class="opt" onclick="responderJuego(${j})">${o}</button>`).join("")}</div>`;
  app.innerHTML = `<div class="card">
    <div class="muted">${S.s.titulo} · pregunta ${S.n + 1} de ${S.preg.length}</div>
    <div class="bar"><div style="width:${S.n / S.preg.length * 100}%"></div></div>
    <div style="margin-top:12px"><span class="tag dir">${dir}</span></div>
    <div style="margin-top:10px">${cabeza}</div>
    ${cuerpo}
    <div id="fb"></div></div>`;
  if (q.modo === "oir") hablar(q.it.texto);
  if (q.modo === "escribir") setTimeout(() => { const el = document.getElementById("resp"); if (el) el.focus(); }, 50);
}
function responderJuego(j){
  const S = sesionAct, q = S.preg[S.n];
  if (document.querySelector("#opc .opt:disabled")) return;
  const ok = q.opc[j] === q.correcta;
  S.total++;
  if (ok) S.aciertos++; else S.fallos.add(q.it.id);
  document.querySelectorAll("#opc .opt").forEach((b, k) => {
    b.disabled = true;
    if (q.opc[k] === q.correcta) b.classList.add("ok");
    else if (k === j) b.classList.add("mal");
  });
  // Tras responder se muestra la respuesta completa: la letra y su pronunciación.
  const explica = q.modo === "ver" && q.campo === "pron" ? `${q.it.texto} se pronuncia: ${q.it.pron}` : q.correcta;
  marcarFeedback(ok, explica);
}
function marcarFeedback(ok, correcta){
  document.getElementById("fb").innerHTML = `
    <p class="muted">${ok ? "✔ Correcto" : "✖ La respuesta era: " + correcta}</p>
    <div class="row"><button class="btn" onclick="siguienteJuego()">Siguiente</button></div>`;
}
// Escritura: compara lo escrito con la palabra, ignorando mayúsculas, espacios y signos.
function responderEscritura(){
  const S = sesionAct, q = S.preg[S.n];
  const input = document.getElementById("resp");
  if (input.disabled) return;
  const norm = s => s.toLowerCase().replace(/\s+/g, "").replace(/[.,!?¿¡'’-]/g, "");
  const validas = [q.it.texto, q.it.romaji].filter(Boolean).map(norm);
  const ok = validas.includes(norm(input.value).replace(/[。、！？]/g, ""));
  input.disabled = true;
  S.total++;
  if (ok) S.aciertos++; else S.fallos.add(q.it.id);
  marcarFeedback(ok, q.it.romaji ? `${q.it.texto} (${q.it.romaji}) · se dice: ${q.it.pron}` : q.it.texto);
}
function siguienteJuego(){ sesionAct.n++; sesionRender(); window.scrollTo(0, 0); }

function finalizar(){

function faseRecuerdo(){

    : `<div class="row"><button class="btn sec" onclick="revelarRecuerdo()">Mostrar respuesta</button></div>`;
  app.innerHTML = `<div class="card">
    <div class="muted">${S.s.titulo} · recuerdo ${S.i + 1} de ${items.length}</div>

function recordarItem(ok){
  const S = sesionAct, it = S.s.items[S.i];
  S.total++;
  if (ok) S.aciertos++; else S.fallos.add(it.id);
  S.i++; S.revelado = false;
  faseRecuerdo();
}
function cerrarRecuerdo(){
  const S = sesionAct;
  S.s.items.forEach(it => programar(it.id, !S.fallos.has(it.id)));
  S.fase = "resultado";
  sesionRender();
}
function faseResultado(){
  const S = sesionAct, pct = S.total ? Math.round(S.aciertos / S.total * 100) : 0;
  if (S.s.id === "libre"){
    app.innerHTML = `<div class="card"><div class="big">Práctica terminada</div>
      <p>Acertaste ${S.aciertos} de ${S.total} (${pct} %).</p>
      <div class="row"><button class="btn" onclick="ir('estudiar')">Volver a Repasar</button></div></div>`;
    sesionAct = null;
    return;
  }
  const pasa = pct >= 60;
  if (pasa) estado.sesiones[S.s.id] = true;
  estado.puntajes[S.s.id] = pct;
  guardar();
  registrarDia();
  const lista = todasSesiones(estado.idioma);
  const sig = lista[lista.findIndex(x => x.id === S.s.id) + 1];
  app.innerHTML = `<div class="card">
    <div class="muted">${S.s.titulo}</div>
    ${pasa ? `<img class="celebra" src="img/celebracion.jpg" alt="">` : ""}
    <div class="big" style="margin-top:6px">${pasa ? "¡Lo lograste!" : "Casi, repítela"}</div>
    <p>Acertaste ${S.aciertos} de ${S.total} (${pct} %). Para avanzar necesitas 60 %.</p>
    <p class="muted">${pasa
      ? "Las palabras que fallaste volverán pronto. Las demás volverán después."
      : "Las palabras que fallaste volverán en pocas horas."}</p>
    <div class="row">
      ${pasa && sig ? `<button class="btn" onclick="empezarSesion('${sig.id}')">Siguiente sesión</button>` : ""}
      ${!pasa ? `<button class="btn" onclick="empezarSesion('${S.s.id}')">Repetir</button>` : ""}
      <button class="btn sec" onclick="salirSesion()">Volver a la ruta</button>
    </div></div>`;
}

// ---------- Progreso: lo estudiado y cómo llevarlo a otro dispositivo ----------
// Palabras estudiadas = palabras de sesiones aprobadas en el idioma activo.
function estudiados(){
  const set = new Set();
  for (const s of todasSesiones(estado.idioma)) if (estaHecha(s.id)) s.items.forEach(it => set.add(it.id));
  return set;
}
// Escena de llamada: solo incluye las frases cuyas palabras ya estudió el alumno.
function escena(k){
  const E = ESCENAS[k];
  if (!E) return null;
  const set = estudiados();
  return { ...E, lineas: E.lineas.filter(L => L.usa && L.usa.length && L.usa.every(id => set.has(id))) };
}
// Código para copiar el progreso a otro teléfono o laptop (sin cuenta).
function mostrarCodigo(){
  const c = btoa(unescape(encodeURIComponent(JSON.stringify(estado))));
  const caja = document.getElementById("codigo");
  caja.value = c; caja.select();
  document.getElementById("msgCodigo").textContent = "Código listo. Cópialo y pégalo en el otro dispositivo.";
}
function cargarCodigo(){
  const caja = document.getElementById("codigo");
  let obj = null;
  try { obj = JSON.parse(decodeURIComponent(escape(atob(caja.value.trim())))); } catch (e) { obj = null; }
  if (!obj || !obj.tarjetas){ document.getElementById("msgCodigo").textContent = "Ese código no es válido."; return; }
  estado = obj;
  estado.tarjetas ||= {}; estado.sesiones ||= {}; estado.puntajes ||= {};
  if (!IDIOMAS[estado.idioma]) estado.idioma = "ingles";
  guardar();
  selIdioma.value = estado.idioma;
  hoy();
  document.getElementById("msgCodigo").textContent = "Progreso cargado en este dispositivo.";
}

// ---------- Modo llamada: profesor (avatar masculino) con diálogo, pronunciación y práctica de voz ----------
// Cada línea: lo que dice el profesor, su traducción, la respuesta esperada y las palabras clave que la validan.

const AVATAR_MAESTRO = `
<svg viewBox="0 0 200 250" id="avatar" class="avatar" aria-label="Profesor Mateo">
  <path d="M28 250 Q36 178 100 172 Q164 178 172 250 Z" fill="#2b4a7a"/>
  <path d="M84 172 L100 200 L116 172 Z" fill="#f1f5f9"/>
  <rect x="88" y="142" width="24" height="36" fill="#d9a77c"/>
  <ellipse cx="100" cy="104" rx="46" ry="54" fill="#f0c49a"/>
  <path d="M54 96 Q50 46 100 42 Q152 46 146 96 Q140 70 100 68 Q68 70 54 96 Z" fill="#2a1d14"/>
  <circle cx="82" cy="104" r="13" fill="none" stroke="#1f2937" stroke-width="3"/>
  <circle cx="118" cy="104" r="13" fill="none" stroke="#1f2937" stroke-width="3"/>
  <line x1="95" y1="104" x2="105" y2="104" stroke="#1f2937" stroke-width="3"/>
  <circle cx="82" cy="104" r="3.5" fill="#1f2937"/>
  <circle cx="118" cy="104" r="3.5" fill="#1f2937"/>
  <ellipse class="boca" cx="100" cy="132" rx="10" ry="4" fill="#8b3a3a"/>
</svg>`;
let llamadaEst = null;
const RECO = window.SpeechRecognition || window.webkitSpeechRecognition;

function llamada(){
  const k = estado.idioma, E = escena(k);
  if (!E){ app.innerHTML = `<div class="card"><p>Aún no hay llamada para este idioma.</p></div>`; return; }
  if (!E.lineas.length){ app.innerHTML = `<div class="llam"><div class="big">Llamada bloqueada</div><p class="muted">Aprueba la sesión de saludos para desbloquear esta llamada. Las frases usan lo que ya estudiaste.</p></div>`; return; }
  if (!llamadaEst || llamadaEst.k !== k) llamadaEst = { k, i: 0, ok: 0, hablado: -1, fb: "", respondida: false, res: [] };
  const total = E.lineas.length, fin = llamadaEst.i >= total;
  if (fin){
    app.innerHTML = `<div class="llam">
      <div class="big">Llamada terminada</div>
      <p class="muted">Respondiste bien ${llamadaEst.ok} de ${total}.</p>
      <ul style="padding-left:18px;line-height:1.6">${E.lineas.map((L, j) => `<li>${llamadaEst.res[j] ? "✔" : "✖"} <b>${L.tu}</b> <span class="muted">${L.tuPr} · ${L.tuEs}</span></li>`).join("")}</ul>
      <div class="row"><button class="btn" onclick="reiniciarLlamada()">Repetir llamada</button></div>
    </div>`;
    return;
  }
  const L = E.lineas[llamadaEst.i];
  if (llamadaEst.hablado !== llamadaEst.i){ llamadaEst.hablado = llamadaEst.i; decirMaestro(L.p); }
  const hayVoz = !!RECO;
  app.innerHTML = `<div class="llam">
    <div class="muted">${E.titulo} · ${llamadaEst.i + 1} de ${total}</div>
    <div class="bar"><div style="width:${llamadaEst.i / total * 100}%"></div></div>
    ${AVATAR_MAESTRO}
    <div class="muted" style="text-align:center">Profesor Mateo</div>
    <div class="subt">
      <div class="big" style="font-size:20px">${L.p}</div>
      <div class="pron">${L.pr}</div>
      <p class="muted">${L.es}</p>
      <p><b>Tu turno:</b> ${L.tu}</p>
      <div class="pron">${L.tuPr}</div>
      <p class="muted">${L.tuEs}</p>
      <div id="fbl" class="muted">${llamadaEst.fb}</div>
      <div class="row">
        <button class="btn sec" onclick="decirMaestro('${esc(L.p)}')">🔊 Escuchar</button>
        ${llamadaEst.respondida
          ? `<button class="btn" onclick="siguienteLinea()">Siguiente</button>`
          : `${hayVoz ? `<button class="btn" onclick="escucharUsuario()">🎤 Hablar</button>` : ""}
             <button class="btn sec" onclick="autoevaluar(true)">✔ Lo dije bien</button>
             <button class="btn sec" onclick="autoevaluar(false)">✖ No me salió</button>`}
      </div>
    </div>
  </div>`;
}
function reiniciarLlamada(){ llamadaEst = null; llamada(); }
function decirMaestro(t){
  const el = document.getElementById("avatar");
  if (el) el.classList.add("habla");
  hablar(t);
  clearTimeout(decirMaestro.t);
  decirMaestro.t = setTimeout(() => { const e = document.getElementById("avatar"); if (e) e.classList.remove("habla"); }, 1200 + t.length * 70);
}
function escucharUsuario(){
  const r = new RECO();
  r.lang = escena(llamadaEst.k).lang;
  r.interimResults = false;
  r.maxAlternatives = 1;
  r.onresult = e => evaluar(e.results[0][0].transcript);
  r.onerror = e => {
    const msg = e.error === "not-allowed" ? "La app no tiene permiso para usar el micrófono. Actívalo en el candado de la barra de direcciones o usa los botones."
      : e.error === "language-not-supported" ? "Tu teléfono no reconoce la voz en este idioma. Usa los botones ✔ / ✖."
      : "No te escuché bien. Intenta otra vez o usa los botones.";
    document.getElementById("fbl").textContent = msg;
  };
  r.start();
}
// Evalúa lo que dijo el alumno (voz) contra las palabras clave de la línea.
function evaluar(texto){
  const L = escena(llamadaEst.k).lineas[llamadaEst.i];
  const t = texto.toLowerCase().replace(/[.,!?¿¡]/g, "");
  const ok = L.clave.every(w => [].concat(w).some(x => t.includes(x.toLowerCase())));
  if (!ok) decirMaestro(L.tu);
  marcar(ok, ok ? "✔ ¡Muy bien!" : `Escuché: "${texto}". Respuesta correcta: "${L.tu}" (${L.tuPr}) — ${L.tuEs}`);
}
// Marca la respuesta de la línea actual (una sola vez) y muestra el botón Siguiente.
function marcar(ok, aviso){
  if (llamadaEst.respondida) return;
  llamadaEst.respondida = true;
  llamadaEst.res[llamadaEst.i] = ok;
  if (ok) llamadaEst.ok++;
  llamadaEst.fb = aviso;
  llamada();
}
function autoevaluar(ok){
  const L = escena(llamadaEst.k).lineas[llamadaEst.i];
  if (!ok) decirMaestro(L.tu);
  marcar(ok, ok ? "✔ ¡Muy bien!" : `Respuesta correcta: "${L.tu}" (${L.tuPr}) — ${L.tuEs}. Escúchala y repítela.`);
}
function siguienteLinea(){
  llamadaEst.i++;
  llamadaEst.respondida = false;
  llamadaEst.fb = "";
  llamada();
}

// ---------- Audio por palabra: MP3 si existe (audio/en, audio/ko o audio/ja), si no voz del navegador ----------
function idiomaDeTexto(texto){
  if (/[가-힯㄰-㆏]/.test(texto)) return { carpeta: "ko", lang: "ko-KR", nombre: "coreano" };
  if (/[\u3040-\u30ff\u4e00-\u9faf]/.test(texto)) return { carpeta: "ja", lang: "ja-JP", nombre: "japonés" };
  return { carpeta: "en", lang: "en-US", nombre: "inglés" };
}
function slug(t){ return t.toLowerCase().replace(/[^a-z0-9가-힯\u3040-\u30ff\u4e00-\u9faf]+/g, "-").replace(/^-|-$/g, ""); }
function hablar(texto){
  const I = idiomaDeTexto(texto);
  const a = new Audio(`audio/${I.carpeta}/${slug(texto)}.mp3`);
  a.onerror = () => voz(texto, I);
  a.play().catch(() => voz(texto, I));
}
function voz(texto, I){
  if (!("speechSynthesis" in window)) return avisar("Este navegador no puede leer en voz alta. Abre la app en Chrome para escuchar la pronunciación.");
  const voces = speechSynthesis.getVoices();
  const base = I.lang.slice(0, 2);
  const v = voces.find(x => x.lang.replace("_", "-").startsWith(base));
  if (voces.length && !v) avisar(`Tu dispositivo no tiene una voz en ${I.nombre} instalada, así que el audio puede sonar mal o no sonar. En Android: Ajustes → Idioma → Salida de texto a voz → instala ${I.nombre}. Mientras tanto, guíate por la pronunciación escrita.`);
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = I.lang;
  if (v) u.voice = v;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) speechSynthesis.getVoices();
// Aviso claro en pantalla (se muestra una vez por mensaje mientras la app está abierta).
function avisar(msg){
  avisar.vistos ||= new Set();
  if (avisar.vistos.has(msg)) return;
  avisar.vistos.add(msg);
  const d = document.createElement("div");
  d.className = "aviso";
  d.innerHTML = `<span>⚠️ ${msg}</span><button class="btn sec" style="padding:6px 12px;font-size:14px">Entendido</button>`;
  d.querySelector("button").onclick = () => d.remove();
  document.body.appendChild(d);
}

// Registro de la PWA (instalable en Chrome y Android)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

render();
